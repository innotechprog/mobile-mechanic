# Apache vhost for metromobilemechanics.co.za
# Requirements:
# 1) Enable modules: rewrite, headers, ssl
# 2) PHP must be enabled (mod_php or php-fpm)

<VirtualHost *:80>
    ServerName metromobilemechanics.co.za
    ServerAlias www.metromobilemechanics.co.za
    DocumentRoot /var/www/metromobilemechanics.co.za

    # Frontend (Vite build output)
    <Directory /var/www/metromobilemechanics.co.za>
        AllowOverride All
        Require all granted
    </Directory>

    # PHP endpoint is served directly from DocumentRoot:
    # /api/send-booking.php

    ErrorLog ${APACHE_LOG_DIR}/metromobile_error.log
    CustomLog ${APACHE_LOG_DIR}/metromobile_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName metromobilemechanics.co.za
    ServerAlias www.metromobilemechanics.co.za
    DocumentRoot /var/www/metromobilemechanics.co.za

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/metromobilemechanics.co.za/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/metromobilemechanics.co.za/privkey.pem

    <Directory /var/www/metromobilemechanics.co.za>
        AllowOverride All
        Require all granted
    </Directory>

    # PHP endpoint is served directly from DocumentRoot:
    # /api/send-booking.php

    ErrorLog ${APACHE_LOG_DIR}/metromobile_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/metromobile_ssl_access.log combined
</VirtualHost>
