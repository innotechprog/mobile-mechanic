# Nginx server config for metromobilemechanics.co.za
# API runs with PM2 on localhost:3001 (or your chosen BOOKING_API_PORT)

server {
    listen 80;
    server_name metromobilemechanics.co.za www.metromobilemechanics.co.za;

    root /var/www/metromobilemechanics.co.za;
    index index.html;

    # Frontend SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy booking API to Node process
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
